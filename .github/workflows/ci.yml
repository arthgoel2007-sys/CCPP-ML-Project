name: ML Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Check Python syntax
      - name: Check Python syntax
        run: |
          python -m compileall -q app.py

      # 5. Validate trained model
      - name: Validate trained model
        run: |
          python -c "import joblib; model = joblib.load('models/ccpp_model.joblib'); print('Model loaded successfully!')"

      # 6. Test model predictions
      - name: Test model prediction
        run: |
          python - <<'PY'
          import joblib
          import numpy as np
          import pandas as pd

          model = joblib.load("models/ccpp_model.joblib")

          sample = pd.DataFrame({
              "AT": [20.0],
              "V": [50.0],
              "AP": [1013.0],
              "RH": [75.0]
          })

          prediction = model.predict(sample)

          assert len(prediction) == 1
          assert np.isfinite(prediction[0])

          print(f"Prediction successful: {prediction[0]:.2f} MW")
          PY

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ccpp-power-predictor .